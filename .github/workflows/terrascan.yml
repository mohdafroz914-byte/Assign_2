name: Terraform Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  terrascan:
    name: Terrascan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List Terraform files
        run: find . -type f -name '*.tf' -not -path '*/.terraform/*'

      - name: Scan Terraform across repository
        uses: tenable/terrascan-action@main
        with:
          iac_type: terraform
          iac_version: v14
          iac_dir: .
          policy_type: all
          verbose: true
