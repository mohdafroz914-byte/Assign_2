name: Terraform Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  terrascan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Terrascan
        run: |
          curl -fsSL \
            https://github.com/tenable/terrascan/releases/download/v1.19.9/terrascan_1.19.9_Linux_x86_64.tar.gz \
            -o "$RUNNER_TEMP/terrascan.tar.gz"
          tar -xzf "$RUNNER_TEMP/terrascan.tar.gz" \
            -C "$RUNNER_TEMP" terrascan
          sudo install "$RUNNER_TEMP/terrascan" /usr/local/bin/terrascan

      - name: Initialize policies
        run: terrascan init

      - name: Scan all Terraform scripts
        run: terrascan scan -i terraform -t all -d . -v
