trigger:
  - main

pool:
  vmImage: ubuntu-24.04

variables:
  dependenciesReady: 'false'

steps:
  - checkout: self

  - task: UseNode@1
    displayName: 'Set up Node.js'
    inputs:
      version: '22.x'

  - bash: |
      set -e
      mkdir -p "$(Build.ArtifactStagingDirectory)/sca-reports"
      cd "$(Build.SourcesDirectory)/sca-practice"

      npm ci

      cp package.json package-lock.json "$(Build.ArtifactStagingDirectory)/sca-reports/"
      echo "##vso[task.setvariable variable=dependenciesReady]true"
    displayName: 'Install practice dependencies'

  - bash: |
      set +e
      cd "$(Build.SourcesDirectory)/sca-practice"

      report="$(Build.ArtifactStagingDirectory)/sca-reports/npm-audit-report.json"
      npm audit --json > "$report"
      result=$?

      cat "$report"
      exit "$result"
    displayName: 'Scan with npm audit'
    condition: and(succeededOrFailed(), eq(variables['dependenciesReady'], 'true'))

  - bash: |
      set +e
      cd "$(Build.SourcesDirectory)/sca-practice"

      report="$(Build.ArtifactStagingDirectory)/sca-reports/retirejs-report.json"
      npx --yes --package retire@5.7.0 retire --path . --outputformat json --outputpath "$report"
      result=$?

      if [ -f "$report" ]; then
        cat "$report"
      fi

      exit "$result"
    displayName: 'Scan with Retire.js'
    condition: and(succeededOrFailed(), eq(variables['dependenciesReady'], 'true'))

  - task: WhiteSource@21
    displayName: 'Scan with Mend Bolt'
    condition: and(succeededOrFailed(), eq(variables['dependenciesReady'], 'true'))
    inputs:
      cwd: '$(Build.SourcesDirectory)/sca-practice'

  - task: PublishPipelineArtifact@1
    displayName: 'Publish SCA reports'
    condition: always()
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/sca-reports'
      artifact: 'sca-reports'
      publishLocation: 'pipeline'